<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>خروجة لطيفة؟</title><style>.date-wrap{position:relative;isolation:isolate;max-width:680px;margin:0 auto;text-align:center;padding:42px 36px 30px;overflow:hidden;background:radial-gradient(ellipse at 85% 5%,#26354b 0,transparent 45%),radial-gradient(ellipse at 10% 100%,#1a2c3c 0,transparent 50%),#101c2d;border:1px solid #86734f;border-radius:3px;min-height:580px;color:#ede6d8;box-shadow:inset 0 0 0 7px #142235,inset 0 0 0 8px #8e78543b,0 22px 60px #09101b18}.date-wrap:before{content:'✦';display:block;color:#d6b77a;font-size:28px;line-height:1;margin-bottom:22px}.date-wrap:after{content:'';position:absolute;inset:16px;border:1px solid #baa16b22;pointer-events:none;z-index:-1}.date-wrap h1{font-family:Arial,sans-serif!important;font-size:38px!important;font-weight:500!important;line-height:1.6!important;letter-spacing:0!important;color:#f0dec0}.date-wrap header{padding:0!important}.date-wrap header p{font-size:21px;line-height:1.8;color:#d1d5dd}.date-kicker{font-size:11px;letter-spacing:.04em;color:#c1a778;margin:0 auto 28px;line-height:1.8;padding:0 8px;width:fit-content}.date-flower{width:280px;max-width:100%;height:210px;margin:18px auto 4px;display:block;animation:date-sway 9s ease-in-out infinite}.date-aside{font-size:16px;line-height:1.9;color:#c6cbd3;margin:10px 0 24px}.date-actions{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}.date-primary{display:flex!important;background:#ddc18c!important;color:#182235!important;border:1px solid #e6d3aa!important;border-radius:2px!important;min-height:52px!important;justify-content:center;align-items:center;font-size:18px!important;font-weight:600!important;max-width:360px;margin:14px auto!important;width:100%;box-sizing:border-box;white-space:normal!important;line-height:1.6!important;padding:12px 18px!important;text-decoration:none!important;box-shadow:0 5px 18px #0002}.date-primary:hover{background:#eed8ae!important}.date-no-zone{height:65px;display:flex;align-items:center;justify-content:center;width:100%}.date-no{background:transparent;color:#c6b18a;border:1px solid #85734f;border-radius:2px;font-size:14px;padding:11px 20px;min-height:44px;transition:transform .18s ease;cursor:pointer;max-width:190px}.date-hint{font-size:12px;color:#9faabb;line-height:1.8;margin:12px auto;max-width:360px}.date-text-button,.date-text-link{display:block;background:none;border:0;text-decoration:underline;text-underline-offset:5px;color:#c3b494;font-size:13px;margin:12px auto;cursor:pointer;padding:10px;min-height:44px;box-sizing:border-box}.date-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:start}.date-fields label{font-size:14px;color:#d6c49f;min-width:0}.date-fields input{display:block;width:100%;box-sizing:border-box;border:1px solid #65718a;background:#192a40;color:#f1e8d6;color-scheme:dark;border-radius:3px;min-height:50px;padding:10px 8px;font-size:16px;margin-top:8px;direction:ltr;min-width:0}.date-wrap section>h2,.date-wrap section>div>h2{color:#d4bd90}.date-plans{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.date-chip{background:#182a40;color:#d8dee7;border:1px solid #546177;border-radius:3px;padding:10px 16px;font-size:15px;line-height:1.5;min-height:44px;cursor:pointer}.date-chip.date-selected{background:#d4bb87;color:#152238;border-color:#d4bb87;font-weight:600}.date-disabled{background:#2c3949;color:#9aa4b1;border:1px solid #4b5769;border-radius:2px;padding:14px 16px;font-size:15px;width:100%;max-width:360px;min-height:52px;margin:14px auto;cursor:not-allowed}.date-summary{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0}.date-summary span{border:1px solid #6c624d;background:#1b2b3e;color:#dccaab;border-radius:2px;padding:8px 12px;font-size:13px;line-height:1.6}.date-letter{text-align:start;background:linear-gradient(135deg,#203047,#142237);border-inline-start:2px solid #d6b77a;border-block:1px solid #4f5a68;border-inline-end:1px solid #4f5a68;border-radius:0;padding:26px;font-size:17px;line-height:2.1;margin:24px 0 30px;color:#e3e4e7}.date-letter p{margin:0 0 18px}.date-letter p:last-child{margin:0}.date-signature{color:#dec89f}.date-hearts{position:absolute;inset:0;pointer-events:none;z-index:-1;overflow:hidden}.date-hearts span{position:absolute;top:100%;color:#d4b276;font-size:24px;animation:date-float 7s linear infinite;opacity:0}@keyframes date-float{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.45}85%{opacity:.3}100%{transform:translateY(-900px) rotate(40deg);opacity:0}}@keyframes date-sway{50%{transform:translateY(-8px) rotate(2deg)}}.date-wrap button:focus-visible,.date-wrap a:focus-visible,.date-wrap input:focus-visible{outline:3px solid #e6c88c;outline-offset:5px}@media(max-width:420px){.date-wrap{padding:30px 18px 24px;min-height:530px;border-radius:3px}.date-wrap h1{font-size:29px!important}.date-wrap header p{font-size:19px}.date-fields{grid-template-columns:1fr}.date-letter{padding:18px;font-size:16px}.date-kicker{font-size:11px}.date-chip{padding:10px 12px;font-size:14px}.date-flower{height:180px;margin-top:6px}.date-wrap:after{inset:10px}}@media(prefers-reduced-motion:reduce){.date-flower,.date-hearts span{animation:none}.date-no{transition:none}}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#1b3048,#080f1b 70%);color:#ede6d8;font-family:Arial,sans-serif;font-size:16px;line-height:1.8;min-height:100vh}main{max-width:760px;margin:40px auto;padding:24px}.date-wrap h1{margin:12px 0 22px;outline:none}.date-wrap header p{margin:8px 0 20px}.date-wrap section{margin:26px 0}.date-wrap h2{font:normal 13px Arial,sans-serif;text-align:start;color:#d4bd90;margin:0 0 12px}button,input,a{font-family:inherit}button{cursor:pointer}footer{font-size:12px;color:#9ca8b7;text-align:center;padding:20px}a{color:inherit}.date-wrap input{font-family:Arial,sans-serif}@media(max-width:420px){main{margin:16px auto;padding:12px}.date-wrap{padding:26px 18px}.date-wrap h1{font-size:29px!important}.date-wrap header p{font-size:19px}}
</style></head><body><main id="app"></main><script>const app=document.getElementById('app');
const state={dodges:0,declined:false,day:'',time:'',plan:''};
const plans=[['coffee','☕ قهوة ورغي','قهوة ورغي'],['walk','نتمشى شوية','تمشية لطيفة'],['dinner','ناكل حاجة حلوة','أكلة حلوة'],['movie','فيلم وفشار','فيلم وفشار'],['surprise','سيبها مفاجأة','مفاجأة لطيفة']];
const hints=['الزر التاني عنده رهبة اجتماعية شوية.','هو بس بياخد لفة وراجع.','هو بس بياخد لفة وراجع.','الزر راح يجيب قهوة ويرجع.'];
const minDay=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Istanbul'}).format(new Date());
const flower=`<svg class="date-flower" viewBox="0 0 300 210" role="img" aria-label="قمر ونجوم وخطوط كوكبة ذهبية"><ellipse cx="150" cy="106" rx="112" ry="49" fill="none" stroke="#9b865e" stroke-opacity=".45" transform="rotate(-25 150 106)"/><circle cx="150" cy="105" r="67" fill="none" stroke="#8e7a54" stroke-width=".7" stroke-dasharray="2 8"/><path d="M171 53a51 51 0 1 0 22 82 47 47 0 0 1-22-82" fill="#dcc18c"/><path d="M43 62l35 25 32-44M200 158l40-28 22 20" fill="none" stroke="#c7a66a" stroke-width=".8"/>${[[43,62],[78,87],[110,43],[200,158],[240,130],[262,150]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${i%2?2:3}" fill="#e1c897"/>`).join('')}<path d="M230 43v18m-9-9h18M67 151v12m-6-6h12" stroke="#e1c897" stroke-width="1.2"/></svg>`;
const head=(title,intro='')=>`<header><h1 tabindex="-1">${title}</h1>${intro?`<p>${intro}</p>`:''}</header>`;
const link=(to,text,kind='date-primary')=>`<a class="${kind}" href="#/${to}">${text}</a>`;
const hearts=()=>`<div class="date-hearts" aria-hidden="true">${['♡','✦','♡','✿','♡','✧'].map((v,i)=>`<span style="inset-inline-start:${8+i*16}%;animation-delay:${i*.4}s">${v}</span>`).join('')}</div>`;
function ready(){return state.day>=minDay()&&/^\d{4}-\d{2}-\d{2}$/.test(state.day)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(state.time)&&plans.some(p=>p[0]===state.plan)}
function render(focus=true){
 const route=location.hash.slice(2)||'';let body='';
 if(route==='yay')body=hearts()+head('طب حلو، اتفقنا مبدئيًا','واضح إن ذوقك حلو')+flower+'<p class="date-aside">فاضل التفاصيل الصغيرة… هنروح فين وإمتى؟</p>'+link('plan','نظبط الخروجة')+link('','استنى، نرجع خطوة','date-text-link');
 else if(route==='plan')body=head('نظبطها على مزاجك','اختاري يوم ووقت وحاجة تحبي نعملها.')+`<section><h2>ميعادنا</h2><div class="date-fields"><label>اليوم<input id="day" type="date" min="${minDay()}" value="${state.day}"></label><label>الساعة<input id="time" type="time" value="${state.time}"></label></div></section><section><h2>نعمل إيه؟</h2><div class="date-plans">${plans.map(p=>`<button type="button" data-plan="${p[0]}" aria-pressed="${state.plan===p[0]}" class="date-chip ${state.plan===p[0]?'date-selected':''}">${p[1]}</button>`).join('')}</div></section><p class="date-aside">اختيارات مهمة. مستقبل الفشار على المحك.</p><div id="continue"></div>`+link('yay','نرجع خطوة','date-text-link')+'<p class="date-hint">الاختيارات هنا بس، مش بتتبعت لحد ومفيش حجز بيتعمل.</p>';
 else if(route==='letter'&&ready()){
 const p=plans.find(p=>p[0]===state.plan);const d=new Intl.DateTimeFormat('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(state.day+'T12:00:00Z'));const t=new Intl.DateTimeFormat('ar-EG',{hour:'numeric',minute:'2-digit',timeZone:'UTC'}).format(new Date('2000-01-01T'+state.time+':00Z'));
 body=hearts()+head('أهو كده بقت خروجة بجد')+`<div class="date-summary"><span>${d}</span><span>${t}</span><span>${p[1]}</span></div><div class="date-letter"><p>يا فاطمة الزهراء،</p><p>يبقى خطتنا: ${p[2]} يوم ${d}، الساعة ${t}.</p><p>المطلوب منك تيجي بمزاج حلو. وأنا عليّا أحاول أقول إفيهات تضحّك فعلًا، مش أضحك عليها لوحدي.</p><p>ولو الميعاد اتغيّر، عادي. المهم نبقى رايقين.</p><p class="date-signature">نشوفك على خير،<br>زياد </p></div>`+link('plan','نعدّل الخطة')+link('','من الأول تاني','date-text-link')+'<p class="date-hint">دي خطة على الصفحة بس، مش رسالة اتبعتت ولا حجز اتأكد.</p>';
 }else if(route==='letter')body=head('لسه ناقصنا الخطة','اختاري اليوم والوقت والنشاط، وبعدين نكتب الكارت.')+link('plan','نختار التفاصيل');
 else if(state.declined)body=head('ولا يهمك يا فاطمة الزهراء','براحتك طبعًا. مفيش امتحان إعادة ولا لجنة إقناع.')+flower+'<button class="date-primary" id="reset" type="button">نرجع للدعوة</button>';
 else body=head('يا فاطمة الزهراء،','إيه رأيك نخرج خروجة لطيفة؟')+flower+'<p class="date-aside">قهوة، شوية رغي، ومحاولة إني مبقاش رخم.</p><div class="date-actions">'+link('yay','يلا بينا ☕')+`<div class="date-no-zone"><button class="date-no" id="no" type="button" style="transform:translateX(${state.dodges%2?-35:25}px)">${'مش عارفة'}</button></div></div><p class="date-hint" aria-live="polite" id="hint">${hints[state.dodges%4]}</p>`;
 app.innerHTML='<div class="date-wrap"><div class="date-kicker">دعوة مخصوص… مش لينك بالغلط</div>'+body+'</div><footer>مفيش أي بيانات بتتبعت من الصفحة.</footer>';
 app.querySelector('#no')?.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')dodge()});app.querySelector('#no')?.addEventListener('click',()=>dodge());app.querySelector('#decline')?.addEventListener('click',decline);app.querySelector('#reset')?.addEventListener('click',()=>{state.declined=false;state.dodges=0;render()});
 ['day','time'].forEach(k=>app.querySelector('#'+k)?.addEventListener('input',e=>{state[k]=e.target.value;updateContinue()}));
 app.querySelectorAll('[data-plan]').forEach(b=>b.addEventListener('click',()=>{state.plan=b.dataset.plan;app.querySelectorAll('[data-plan]').forEach(x=>{x.classList.toggle('date-selected',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')});updateContinue()}));
 updateContinue();if(focus){window.scrollTo({top:0,behavior:'instant'});app.querySelector('h1')?.focus({preventScroll:true})}
}
function updateContinue(){const el=app.querySelector('#continue');if(el)el.innerHTML=ready()?link('letter','كده عندنا خطة '):'<button class="date-disabled" type="button" disabled>اختاري اليوم والوقت والنشاط الأول</button>'}
function dodge(){state.dodges=state.dodges+1;const b=app.querySelector('#no');if(b){b.style.transform=`translateX(${state.dodges%2?-35:25}px)`;b.textContent='مش عارفة';app.querySelector('#hint').textContent=hints[state.dodges%4]}}
function decline(){state.declined=true;render()}
window.addEventListener('hashchange',()=>render());render(false);
</script></body></html>
